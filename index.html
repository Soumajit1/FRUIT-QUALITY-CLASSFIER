<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Quality Classifier</title>
    <!-- Automatic instant redirect to Streamlit app -->
    <meta http-equiv="refresh" content="0; url=http://localhost:8501/">
    <script>
        // Redirect immediately to the running Streamlit server
        window.location.replace("http://localhost:8501/");
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0e1117;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #ff4b4b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        p {
            font-size: 15px;
            color: #9ca3af;
            margin-bottom: 24px;
        }
        .btn {
            background-color: #ff4b4b;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s ease;
        }
        .btn:hover {
            background-color: #e03b3b;
        }
    </style>
</head>
<body>
    <!-- Fallback iframe in case redirect is blocked by browser policies -->
    <iframe src="http://localhost:8501/" allow="camera; microphone; clipboard-read; clipboard-write;" onerror="showFallback()"></iframe>
</body>
</html>
